        <div class="container">

                    aria-controls="menu-principal" aria-expanded="false" aria-label="Ouvrir ou fermer le menu">

                </ul>
            </div>
        </div>
    </nav>
</header>

<main id="contenu" class="container py-4">
    <h1>Nos menus</h1>

    <form id="filtres" class="mb-4 p-3 carte-avis" aria-label="Filtres des menus">
        <fieldset>
            <legend class="h5">Filtrer les menus</legend>
            <div class="row g-3">
                <div class="col-sm-6 col-lg-4">
                    <label for="prix_max" class="form-label">Prix maximum (€)</label>
                    <input type="number" min="0" step="1" class="form-control" id="prix_max" name="prix_max">
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="fourchette_min" class="form-label">Fourchette de prix : de (€)</label>
                    <input type="number" min="0" step="1" class="form-control" id="fourchette_min" name="fourchette_min">
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="fourchette_max" class="form-label">Fourchette de prix : à (€)</label>
                    <input type="number" min="0" step="1" class="form-control" id="fourchette_max" name="fourchette_max">
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="theme" class="form-label">Thème</label>
                    <select class="form-select" id="theme" name="theme"><option value="">Tous les thèmes</option></select>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="regime" class="form-label">Régime</label>
                    <select class="form-select" id="regime" name="regime"><option value="">Tous les régimes</option></select>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="personnes" class="form-label">Nombre de personnes</label>
                    <input type="number" min="1" step="1" class="form-control" id="personnes" name="personnes" aria-describedby="aide-personnes">
                    <div id="aide-personnes" class="form-text">Menus commandables pour ce nombre de personnes.</div>
                </div>
            </div>
            <button type="reset" class="btn btn-outline-secondary mt-3">Réinitialiser les filtres</button>
        </fieldset>
    </form>

    <p id="compteur" aria-live="polite"></p>
    <div id="liste-menus" class="row g-4"></div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="row">

</footer>

</body>
</html>
