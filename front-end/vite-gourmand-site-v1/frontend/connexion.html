    <nav class="navbar navbar-expand-lg" aria-label="Navigation principale">

<main id="contenu" class="container py-4" style="max-width: 640px;">
    <h1>Connexion</h1>
    <div id="message" role="alert" tabindex="-1"></div>
    <form id="form-connexion" class="mt-3">
        <div class="mb-3"><label for="email" class="form-label">Adresse e-mail</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="username"></div>
        <div class="mb-3"><label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password"></div>
        <button type="submit" class="btn btn-vg">Se connecter</button>
    </form>
    <p class="mt-3">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
</main>
